<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karaokê do Romas — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #f1f5f9;
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.9rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 9999px;
      font-size: 0.8rem;
      color: #fca5a5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.65rem 1.5rem;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 0.75rem;
      color: #c084fc;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: rgba(168, 85, 247, 0.3); }
    .note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🎤</div>
    <div class="badge">🔴 Sem conexão</div>
    <h1>Karaokê do Romas</h1>
    <p>
      Você está offline. Se já usou o aplicativo antes, tente recarregar —
      o modo local pode estar disponível.
    </p>
    <p>
      Suas músicas locais e a biblioteca continuam funcionando sem internet.
    </p>
    <a href="/" class="btn" onclick="window.location.reload(); return false;">
      Tentar novamente
    </a>
    <p class="note">
      Modo LOCAL-FIRST ativo. Firebase é opcional.
    </p>
  </div>
</body>
</html>
